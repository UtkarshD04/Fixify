apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixify-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixify-frontend
  template:
    metadata:
      labels:
        app: fixify-frontend
    spec:
      containers:
        - name: fixify-frontend
          image: fixify-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fixify-frontend-service
spec:
  selector:
    app: fixify-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
