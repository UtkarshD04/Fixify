apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fixify-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: fixify.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fixify-frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fixify-backend-service
                port:
                  number: 4000
